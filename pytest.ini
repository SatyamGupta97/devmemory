[pytest]
# Single source of truth for the whole repo, so `pytest` works from the repo
# root and from backend/ alike.
#
# Tests import the service as `from app.main import app`. By default pytest's
# prepend import mode puts tests/ on sys.path (not backend/), so the `app`
# package would not be importable. Declaring the source root here fixes that
# once, instead of hacking sys.path inside every test module.
pythonpath = backend
testpaths = backend/tests
addopts = -ra
